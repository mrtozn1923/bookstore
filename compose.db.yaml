# BookstoreDb: SQL Server, the one-off schema migration and an sqlcmd client.
# Included by compose.yaml; can also run on its own: docker compose -f compose.db.yaml up -d
services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      # Not in the documented variable list, but SQL Server 2025 reads the sa password from this file
      MSSQL_SA_PASSWORD_FILE: /run/secrets/sa-password
    secrets:
      - sa-password
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: SQLCMDPASSWORD="$$(cat /run/secrets/sa-password)" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  # Ad-hoc queries, never started by up: docker compose run --rm sqlcmd -Q "SELECT COUNT(*) FROM dbo.Books"
  sqlcmd:
    image: mcr.microsoft.com/mssql/server:2025-latest
    profiles: [cli]
    entrypoint:
      - /bin/bash
      - -c
      - >-
        SQLCMDPASSWORD="$$(cat /run/secrets/sa-password)"
        BOOKSTORE_DB_PASSWORD="$$(cat /run/secrets/db-app-password 2>/dev/null)"
        exec /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -b "$$@"
      - sqlcmd
    environment:
      SQLCMDDBNAME: BookstoreDb
    secrets:
      - sa-password
    depends_on:
      db:
        condition: service_healthy

  # One-off: creates BookstoreDb and the app login, then exits with 0. Same client as sqlcmd.
  migrate:
    extends:
      service: sqlcmd
    profiles: !reset []
    command: ["-i", "/scripts/01-bookstore.sql", "-i", "/scripts/02-app-login.sql"]
    environment:
      SQLCMDDBNAME: master
    secrets:
      - db-app-password
    volumes:
      - ./db:/scripts:ro

volumes:
  db-data:

secrets:
  sa-password:
    file: ./secrets/sa-password.txt
  db-app-password:
    file: ./secrets/db-app-password.txt
