- description: pq-01
  vars:
    question: "Kitabı 10 gün önce teslim aldım, beğenmedim. İade edebilir miyim?"
  assert:
    - type: javascript
      value: "[\"14 gün\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
    - type: javascript
      value: "[\"49,90\",\"müşteriye ait\",\"size ait\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
- description: pq-02
  vars:
    question: "Kitap yırtık geldi, teslim alalı üç hafta oldu. İade kargosunu kim öder?"
  assert:
    - type: javascript
      value: "[\"30 gün\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
    - type: javascript
      value: "[\"Bookstore öde\",\"biz öde\",\"tarafımızdan\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
- description: pq-03
  vars:
    question: "İade ettiğim kitabın parası ne zaman yatar?"
  assert:
    - type: javascript
      value: "[\"10 iş günü\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
    - type: javascript
      value: "[\"banka\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
- description: pq-04
  vars:
    question: "Okulumuz 200 kitaplık kurumsal sipariş verdi. 40 kitabı iade edebilir miyiz?"
  assert:
    - type: javascript
      value: "[\"20\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
    - type: javascript
      value: "[\"kurumsal satış\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
- description: pq-05
  vars:
