      value: "[\"edilemez\",\"iade edemezsiniz\",\"mümkün değil\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
- description: pq-06
  vars:
    question: "3 al 2 öde kampanyasından aldığım kitaplardan birini iade edersem ne olur?"
  assert:
    - type: javascript
      value: "[\"yeniden hesaplan\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
- description: pq-07
  vars:
    question: "Aldığım Dune'u ciltli baskısıyla değiştirebilir miyim?"
  assert:
    - type: javascript
      value: "[\"stok\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
    - type: javascript
      value: "[\"fiyat fark\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
- description: pq-08
  vars:
    question: "Kitabı 20 gün önce teslim aldım ve fikrimi değiştirdim. İade edebilir miyim?"
  assert:
    - type: javascript
      value: "[\"14 gün\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
- description: pq-09
  vars:
    question: "Yurt dışındaki adresime gönderilen kitabı nasıl iade ederim?"
  assert:
    - type: javascript
      value: "[\"müşteri hizmetleri\",\"yer almıyor\",\"bilgi bulunmuyor\",\"belirtilmemiş\",\"kapsamıyor\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
- description: pq-10
  vars:
    question: "İade için kargo kodu ücretli mi?"
  assert:
    - type: javascript
      value: "[\"49,90\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
    - type: javascript
      value: "[\"Bookstore öde\",\"hasarlı\"].some(f => output.toLocaleLowerCase('tr-TR').includes(f.toLocaleLowerCase('tr-TR')))"
      metric: facts
