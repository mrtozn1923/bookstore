# /etc/nginx/sites-available/bookstore
log_format bookstore '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     '$request_time $upstream_response_time $request_id';

upstream bookstore_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # The load balancer in front of us sends the real client IP
    set_real_ip_from 10.20.30.0/24;
    real_ip_header X-Forwarded-For;

    access_log /var/log/nginx/bookstore.access.log bookstore;
    error_log /var/log/nginx/bookstore.error.log;

    location / {
        proxy_pass http://bookstore_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
