# Bookstore.Admin behind Nginx. The Upgrade/Connection headers let the Blazor circuit use WebSockets;
# without them SignalR falls back to long polling. TLS termination is left out of this example.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name admin.bookstore.example;

    location / {
        proxy_pass         http://127.0.0.1:5037;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        # $http_host keeps the port; $host drops it, and the panel's redirects then point to the wrong address.
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # A circuit is a long-lived connection; SignalR's keep-alive pings every 15 seconds keep it below this.
        proxy_read_timeout 100s;
        proxy_buffering    off;
    }
}
