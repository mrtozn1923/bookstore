# The SPA on a static host (nginx). Same two rules as the BFF: SPA fallback and cache headers.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite puts a content hash into every file name under /assets: cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # A real file if there is one, otherwise index.html: React Router handles /books/9780441172719
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
