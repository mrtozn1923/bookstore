apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: bookstore
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        # Kubernetes auth: service account token ile, saklanan bir secret olmadan
        kubernetes:
          mountPath: kubernetes
          role: bookstore-eso
          serviceAccountRef:
            name: bookstore-eso
