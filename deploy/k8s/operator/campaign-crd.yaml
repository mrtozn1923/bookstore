apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: campaigns.bookstore.example.com
spec:
  group: bookstore.example.com
  scope: Namespaced
  names:
    kind: Campaign
    plural: campaigns
    singular: campaign
    shortNames: ["camp"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Discount
          type: integer
          jsonPath: .spec.discountPercent
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["title", "discountPercent", "startsAt", "endsAt"]
              x-kubernetes-validations:
                - rule: "self.endsAt > self.startsAt"
                  message: "endsAt must be after startsAt"
              properties:
                title:
                  type: string
                  maxLength: 80
                discountPercent:
                  type: integer
                  minimum: 1
                  maximum: 70
                startsAt:
                  type: string
                  format: date-time
                endsAt:
                  type: string
                  format: date-time
                isbns:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    pattern: "^97[89][0-9]{10}$"
            status:
              type: object
              properties:
                phase:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                configMapName:
                  type: string
