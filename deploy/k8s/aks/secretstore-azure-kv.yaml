# AKS: ESO, Key Vault'a workload identity ile bağlanır (bu yazıda çalıştırılmadı)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookstore-eso
  namespace: bookstore
  annotations:
    azure.workload.identity/client-id: "<user-assigned-identity-client-id>"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-kv
  namespace: bookstore
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://bookstore-kv-prod.vault.azure.net
      serviceAccountRef:
        name: bookstore-eso
