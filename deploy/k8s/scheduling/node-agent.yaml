apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: bookstore
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-agent
    spec:
      tolerations:
        - key: bookstore.example.com/pool
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: busybox:1.37
          command: ["sh", "-c", "trap 'exit 0' TERM; while true; do sleep 5; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
