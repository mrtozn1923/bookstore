apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: bookstore
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/part-of: bookstore
    spec:
      securityContext:
        # The chiseled image already runs as the non-root "app" user (1654); Kubernetes enforces it
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog
          image: bookstore-catalog
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # Connection strings with passwords: a Secret per environment, never in this repository
            - secretRef:
                name: catalog-connections
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          # Liveness: the process answers. Readiness: its database answers too (post 14, ServiceDefaults)
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # .NET writes a few files under /tmp (diagnostics IPC); the rest of the file system is read-only
        - name: tmp
          emptyDir: {}
