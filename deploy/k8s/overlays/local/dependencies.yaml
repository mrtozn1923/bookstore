# Throwaway dependencies for a local cluster only: no volumes, one replica, data is lost with the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: sql }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sql }
    spec:
      containers:
        - name: sql
          image: mcr.microsoft.com/mssql/server:2025-latest
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_MEMORY_LIMIT_MB, value: "1024" }
            - name: MSSQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: dependencies, key: SQL_PASSWORD } }
          ports: [{ containerPort: 1433 }]
          # Without a request the scheduler does not reserve memory for it; under pressure it is the first to be killed
          resources:
            requests: { memory: 1536Mi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: sql
spec:
  selector: { app.kubernetes.io/name: sql }
  ports: [{ port: 1433 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      containers:
        - name: redis
          image: redis:8.6
          args: ["--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: dependencies, key: REDIS_PASSWORD } }
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3-management
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: bookstore }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: dependencies, key: RABBITMQ_PASSWORD } }
          ports: [{ containerPort: 5672 }]
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports: [{ port: 5672 }]
