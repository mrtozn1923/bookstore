apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookstore-api
  namespace: bookstore
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: bookstore-api-secrets
    creationPolicy: Owner
  data:
    # Key adları .NET configuration'ın beklediği biçimde: "__" = ":"
    - secretKey: Jwt__SigningKey
      remoteRef:
        key: bookstore/api
        property: jwt_signing_key
    - secretKey: Email__ApiKey
      remoteRef:
        key: bookstore/api
        property: email_api_key
