# Alertmanager for Bookstore (local). Notifications go to tools/Bookstore.AlertSink as webhooks;
# in production these receivers would be the on-call tool, the ticket queue and a heartbeat service.
route:
  receiver: ticket
  # One notification per alert and service, not one per series.
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: on-call
    - matchers: [severity="heartbeat"]
      receiver: heartbeat
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

receivers:
  - name: on-call
    webhook_configs:
      - url: http://localhost:5095/alerts/on-call
  - name: ticket
    webhook_configs:
      - url: http://localhost:5095/alerts/ticket
  - name: heartbeat
    webhook_configs:
      - url: http://localhost:5095/alerts/heartbeat

inhibit_rules:
  # When the API sends no telemetry at all, its other alerts are noise: they can't be evaluated anyway.
  - source_matchers: [alertname="BookstoreApiTelemetryMissing"]
    target_matchers: [severity=~"page|ticket"]
    equal: [service]
