# Prometheus config of grafana/otel-lgtm 0.41.0 (copied from /otel-lgtm/prometheus.yaml in the image) plus Bookstore's
# rule files and Alertmanager at the end. Mounted over the image's file by compose.yaml.
---
global:
  scrape_native_histograms: true
  # Bookstore: rules and alerts are evaluated every 15 s (the default is 1 minute).
  evaluation_interval: 15s
otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias
storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m

# Bookstore: everything above is the image's own config; only these blocks are ours.
rule_files:
  - /otel-lgtm/bookstore-rules/*.yaml

alerting:
  alertmanagers:
    # Alertmanager runs next to the container (alertmanager.yml in this folder).
    - static_configs:
        - targets: ["host.docker.internal:9093"]
