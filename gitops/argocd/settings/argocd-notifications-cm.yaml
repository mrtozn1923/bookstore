apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/component: notifications-controller
    app.kubernetes.io/name: argocd-notifications-controller
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
data:
  # Lab receiver; in a real setup service.slack, service.teams or the on-call tool's webhook.
  service.webhook.lab: |
    url: http://webhook-receiver.lab-tools.svc.cluster.local:8080/argocd
    headers:
      - name: Content-Type
        value: application/json
  template.app-event: |
    webhook:
      lab:
        method: POST
        body: |
          {"app": "{{.app.metadata.name}}", "revision": "{{.app.status.sync.revision}}",
           "sync": "{{.app.status.sync.status}}", "health": "{{.app.status.health.status}}",
           "message": "{{.app.status.operationState.message}}"}
  trigger.on-deployed: |
    - description: A sync succeeded and the application is Healthy
      oncePer: app.status.sync.revision
      send: [app-event]
      when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
  trigger.on-health-degraded: |
    - description: The application is Degraded
      send: [app-event]
      when: app.status.health.status == 'Degraded'
  # Every Bookstore app, without annotating each generated Application.
  subscriptions: |
    - recipients: [lab]
      triggers: [on-deployed, on-health-degraded]
      selector: component in (api, web)
