apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookstore-api-dev
  namespace: argocd
  # Deleting the Application also deletes the resources it created.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://git-server.git-server.svc.cluster.local/bookstore-config
    targetRevision: main
    path: apps/api/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: bookstore-dev
