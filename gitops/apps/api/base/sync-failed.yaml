apiVersion: batch/v1
kind: Job
metadata:
  name: sync-failed
  annotations:
    argocd.argoproj.io/hook: SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: notify
          image: curlimages/curl:8.17.0
          # In a real setup this posts to a chat/webhook; here it only writes a log line.
          command: ["sh", "-c", "echo \"sync of $(APP) failed, migrations or deploy did not finish\""]
          env:
            - name: APP
              value: bookstore-api
