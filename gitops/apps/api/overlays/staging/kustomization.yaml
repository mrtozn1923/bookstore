apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bookstore-staging
resources:
- ../../base
generators:
- secret-generator.yaml
images:
- digest: sha256:<digest-from-your-ci-run>
  name: bookstore/api
  newName: localhost:52612/bookstore/api
  newTag: 1.2.0
- digest: sha256:<digest-from-your-ci-run>
  name: bookstore/migrator
  newName: localhost:52612/bookstore/migrator
  newTag: 1.2.0
