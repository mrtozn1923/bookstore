apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bookstore-prod
resources:
- ../../base
- sealed-api-db.yaml
images:
- digest: sha256:<digest-from-your-ci-run>
  name: bookstore/api
  newName: localhost:52612/bookstore/api
  newTag: 1.3.0
- digest: sha256:<digest-from-your-ci-run>
  name: bookstore/migrator
  newName: localhost:52612/bookstore/migrator
  newTag: 1.3.0
patches:
- path: rollout-canary.yaml
