# Sealed with the cluster's public key: only the controller in this cluster can decrypt it,
# and only as the Secret api-db in bookstore-prod (strict scope).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: api-db
  namespace: bookstore-prod
  annotations:
    # Before postgres (wave -1): the controller turns this into the api-db Secret.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  encryptedData:
    connection-string: 
    password: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
      name: api-db
      namespace: bookstore-prod
    type: Opaque
