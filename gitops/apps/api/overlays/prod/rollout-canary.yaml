# Prod releases go through a canary: 25% -> 50% -> 100%, with Prometheus analysis in the background.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
spec:
  replicas: 4
  strategy:
    canary:
      analysis:
        templates:
          - templateName: api-canary-health
        # Start analysing at step 1 (after the first setWeight), abort the rollout when it fails.
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 25
        - pause: {duration: 2m}
        - setWeight: 50
        - pause: {duration: 2m}
