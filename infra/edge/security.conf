# edge-side rate limit for the login endpoint (stands in for a CDN rate limiting rule)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

upstream origin_tls {
    server host.docker.internal:5443;
}

server {
    listen 8082;
    server_name bookstore.example;
    proxy_set_header Host $host;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass https://origin_tls;
    }

    location / {
        proxy_pass https://origin_tls;
    }
}

# origin-side lock: only Cloudflare's ranges may connect
server {
    listen 8090;
    server_name bookstore.example;
    include /etc/nginx/cloudflare-allow.conf;

    location / {
        proxy_pass https://origin_tls;
    }
}
