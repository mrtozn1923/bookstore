# edge.conf: a single CDN edge node in front of the Bookstore origin
proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:10m max_size=200m inactive=1d use_temp_path=off;

upstream origin {
    server host.docker.internal:5180;
}

server {
    listen 8080;
    server_name bookstore.example;

    proxy_cache edge;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    proxy_set_header Host $host;
    add_header X-Cache-Status $upstream_cache_status always;

    location / {
        proxy_pass http://origin;
    }

    location /api/ {
        # never serve or store a cached answer for a request that carries credentials
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        proxy_pass http://origin;
    }
}

# a misconfigured edge: the query string is left out of the cache key
server {
    listen 8081;
    server_name bookstore.example;

    proxy_cache edge;
    proxy_cache_key $scheme$host$uri;
    proxy_set_header Host $host;
    add_header X-Cache-Status $upstream_cache_status always;

    location / {
        proxy_pass http://origin;
    }
}
