include "/etc/bind/rndc.key";
controls { inet 127.0.0.1 allow { localhost; } keys { "rndc-key"; }; };

options {
    directory "/var/cache/bind";
    recursion no;
    listen-on { any; };
    listen-on-v6 { none; };
};

zone "dnshost.example" {
    type primary;
    file "/etc/bind/dnshost.example.zone";
};

zone "bookstore.example" {
    type primary;
    file "/etc/bind/bookstore.example.zone";
    dnssec-policy default;
    inline-signing yes;
    key-directory "/var/cache/bind";
};

zone "corpmail.example" {
    type primary;
    file "/etc/bind/corpmail.example.zone";
};

zone "txprovider.example" {
    type primary;
    file "/etc/bind/txprovider.example.zone";
};

zone "saas.example" {
    type primary;
    file "/etc/bind/saas.example.zone";
};
