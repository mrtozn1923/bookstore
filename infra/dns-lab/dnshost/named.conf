options {
    directory "/var/cache/bind";
    recursion no;
    listen-on { any; };
    listen-on-v6 { none; };
};

zone "dnshost.example" {
    type primary;
    file "/etc/bind/dnshost.example.zone";
};

zone "bookstore.example" {
    type primary;
    file "/etc/bind/bookstore.example.zone";
};
