include "/etc/bind/rndc.key";
controls { inet 127.0.0.1 allow { localhost; } keys { "rndc-key"; }; };

options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    // lab only: this server is also the validating resolver
    recursion yes;
    allow-recursion { 192.0.2.0/24; 127.0.0.1; };
    dnssec-validation no;
};

zone "example" {
    type primary;
    file "/etc/bind/example.zone";
    dnssec-policy default;
    inline-signing yes;
    key-directory "/var/cache/bind";
};
