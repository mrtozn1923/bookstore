# Lab-only Git server: serves the config repo mounted into the kind node (read-only, no auth).
apiVersion: v1
kind: Namespace
metadata:
  name: git-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: git-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: git-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-server
    spec:
      containers:
        - name: git-server
          image: gitopsseries-git-server:1.0.0
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: repos
              mountPath: /srv/git
              readOnly: true
      volumes:
        - name: repos
          hostPath:
            path: /srv/git
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: git-server
spec:
  selector:
    app.kubernetes.io/name: git-server
  ports:
    - name: http
      port: 80
      targetPort: http
