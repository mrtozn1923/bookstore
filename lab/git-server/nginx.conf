# Clone and fetch need no auth; push (git-receive-pack) needs a user from the htpasswd file.
map "$uri$arg_service" $git_auth {
    ~git-receive-pack "Bookstore lab git";
    default off;
}
server {
    listen 8080;
    location / {
        auth_basic $git_auth;
        auth_basic_user_file /etc/git-server/htpasswd;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
        fastcgi_param GIT_PROJECT_ROOT /srv/git;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
        fastcgi_param PATH_INFO $uri;
        # git http-backend accepts a push only when REMOTE_USER is set.
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_pass unix:/run/fcgiwrap.sock;
    }
}
