kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# containerd reads per-registry settings from /etc/containerd/certs.d (lab registry: post 06).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.cri.v1.images".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    # The GitOps config repo (a local Git repository) is visible inside the node at /srv/git/bookstore-config.
    # Replace the hostPath with your clone of the config repo (on Windows e.g. C:/work/bookstore-config).
    # Writable since post 06: Argo CD Image Updater pushes its commits through the lab git server.
    extraMounts:
      - hostPath: /path/to/bookstore-config
        containerPath: /srv/git/bookstore-config
