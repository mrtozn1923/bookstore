<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookstore checkout</title>
    <link id="css" rel="stylesheet" href="checkout.out.css">
</head>
<body class="bg-slate-50 p-8 text-slate-900">
    <form class="mx-auto flex max-w-md flex-col gap-4 rounded-lg bg-white p-6">
        <label class="block">
            <span class="text-sm font-medium">Email</span>
            <input id="email" type="email" placeholder="ada@example.com" class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 caret-indigo-600 placeholder:text-slate-400 focus-visible:outline-2 focus-visible:outline-indigo-600">
        </label>
        <label class="block">
            <span class="text-sm font-medium">Shipping</span>
            <select id="shipping" class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2">
                <option>Standard (3-5 days)</option>
                <option>Express (next day)</option>
            </select>
        </label>
        <label class="block">
            <span class="text-sm font-medium">Delivery note</span>
            <textarea id="note" rows="1" class="mt-1 block w-full field-sizing-content rounded-md border border-slate-300 px-3 py-2"></textarea>
        </label>
        <label class="flex items-center gap-2">
            <input id="gift" type="checkbox" class="size-4 accent-indigo-600">
            <span>Gift wrap</span>
        </label>
        <label class="flex items-center gap-2">
            <input id="invoice" type="checkbox" class="size-4 text-indigo-600 accent-indigo-600">
            <span>Send an invoice</span>
        </label>
        <label class="block">
            <span class="text-sm font-medium">Purchase order (PDF)</span>
            <input id="po" type="file" accept="application/pdf" class="mt-1 block text-sm file:me-4 file:rounded file:border-0 file:bg-indigo-50 file:px-3 file:py-1 file:text-indigo-700">
        </label>
        <button id="place-order" type="submit" disabled class="cursor-pointer rounded bg-indigo-600 py-2 text-white select-none disabled:cursor-not-allowed disabled:opacity-50">Place order</button>
    </form>
</body>
</html>
