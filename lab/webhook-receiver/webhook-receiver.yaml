# Lab-only webhook receiver (post 09): prints every request it gets, answers 200.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
  namespace: lab-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-receiver
    spec:
      containers:
        - name: receiver
          image: alpine:3.22
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                printf 'HTTP/1.1 200 OK\r\nContent-Length: 0\r\nConnection: close\r\n\r\n' | nc -l -p 8080
                echo
              done
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver
  namespace: lab-tools
spec:
  selector:
    app.kubernetes.io/name: webhook-receiver
  ports:
    - port: 8080
