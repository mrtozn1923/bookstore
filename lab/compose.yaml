# Bookstore Redis lab: Redis 8 and Valkey 9 side by side, Redis Insight optional
name: bookstore-redis-lab
services:
  redis:
    image: redis:8
    # post 12: AOF next to RDB, a memory limit, and noeviction (streams and queues must never be evicted)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      # only reachable from this machine
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
  valkey:
    image: valkey/valkey:9
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - valkey-data:/data
  valkey-bundle:
    # Valkey with valkey-json, valkey-search and valkey-bloom (post 11)
    image: valkey/valkey-bundle:9
    profiles: ["bundle"]
    ports:
      - "127.0.0.1:6381:6379"
  insight:
    image: redis/redisinsight:3.8
    profiles: ["tools"]
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - insight-data:/data
volumes:
  redis-data:
  valkey-data:
  insight-data:
