# Bookstore CI: one version per run, build, and integration tests
parameters:
  - name: buildConfiguration
    displayName: Build configuration
    type: string
    default: Release
    values:
      - Release
      - Debug
  - name: runIntegrationTests
    displayName: Run integration tests
    type: boolean
    default: true

trigger:
  batch: true
  branches:
    include:
      - main
      - release/*
  paths:
    exclude:
      - web
      - README.md

schedules:
  - cron: "0 2 * * 1-5"
    displayName: Nightly integration run
    branches:
      include:
        - main
    always: false

pool:
  vmImage: ubuntu-24.04

variables:
  buildConfiguration: ${{ parameters.buildConfiguration }}

jobs:
  - job: Version
    displayName: Compute version
    steps:
      - checkout: self
        fetchDepth: 1
      - script: bash scripts/set-version.sh
        name: setVersion
        displayName: Compute app version

  - job: Api
    displayName: Build and test API
    dependsOn: Version
    variables:
      appVersion: $[ dependencies.Version.outputs['setVersion.appVersion'] ]
    steps:
      - checkout: self

      - task: UseDotNet@2
        displayName: Install .NET SDK from global.json
        inputs:
          packageType: sdk
          useGlobalJson: true

      - script: dotnet restore Bookstore.slnx
        displayName: Restore

      - script: dotnet build Bookstore.slnx --no-restore -c $(buildConfiguration) -p:Version=$(appVersion)
        displayName: Build $(appVersion)

      - ${{ if eq(parameters.runIntegrationTests, true) }}:
          - script: bash scripts/start-test-sql.sh
            displayName: Start SQL Server for integration tests

          - script: dotnet test --solution Bookstore.slnx --no-build -c $(buildConfiguration)
            displayName: Test
            env:
              ConnectionStrings__BookstoreDb: $(TestDbConnection)
