# Bookstore CI: extends the shared, version-pinned skeleton from the pipeline-templates repository
name: $(SourceBranchName)-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: buildConfiguration
    displayName: Build configuration
    type: string
    default: Release
    values:
      - Release
      - Debug
  - name: runIntegrationTests
    displayName: Run integration tests
    type: boolean
    default: true

trigger:
  batch: true
  branches:
    include:
      - main
      - release/*
  paths:
    exclude:
      - README.md

schedules:
  - cron: "0 2 * * 1-5"
    displayName: Nightly integration run
    branches:
      include:
        - main
    always: false

resources:
  repositories:
    - repository: templates
      type: git
      name: Bookstore/pipeline-templates
      ref: refs/tags/v1.4.0

extends:
  template: pipelines/bookstore-ci.yml@templates
  parameters:
    solution: Bookstore.slnx
    apiProject: src/Bookstore.Api/Bookstore.Api.csproj
    webDirectory: web/bookstore-web
    webDistDirectory: web/bookstore-web/dist/bookstore-web/browser
    nugetConfig: build/nuget.feed.config
    npmrc: build/feed.npmrc
    buildConfiguration: ${{ parameters.buildConfiguration }}
    runIntegrationTests: ${{ parameters.runIntegrationTests }}
    extraApiSteps:
      - task: DotNetCoreCLI@2
        displayName: Check formatting
        inputs:
          command: custom
          custom: format
          arguments: Bookstore.slnx --verify-no-changes --no-restore
