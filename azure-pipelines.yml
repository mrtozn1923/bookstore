# Bookstore CI: restore, build and test on every push to main
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

variables:
  buildConfiguration: Release

steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: Install .NET SDK from global.json
    inputs:
      packageType: sdk
      useGlobalJson: true

  - script: dotnet restore Bookstore.slnx
    displayName: Restore

  - script: dotnet build Bookstore.slnx --no-restore -c $(buildConfiguration)
    displayName: Build

  - script: bash scripts/start-test-sql.sh
    displayName: Start SQL Server for integration tests

  - script: dotnet test --solution Bookstore.slnx --no-build -c $(buildConfiguration)
    displayName: Test
    env:
      ConnectionStrings__BookstoreDb: $(TestDbConnection)
