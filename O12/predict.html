<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Predict</title>
</head>
<body>
  <button id="add-to-cart" data-book-id="42" data-in-stock="false">Add to cart</button>

  <script>
    const button = document.querySelector("#add-to-cart");
    console.log(button.dataset.bookId + 1);
    console.log(button.dataset.inStock ? "in stock" : "sold out");
  </script>
</body>
</html>
