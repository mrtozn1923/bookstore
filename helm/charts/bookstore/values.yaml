# Shared with subcharts: every chart can read .Values.global.
global:
  # Mirror registry for all images, e.g. registry.example.com/mirror (empty: use the image names as they are).
  imageRegistry: ""

# Bookstore.Api
image:
  repository: helmseries-bookstore-api
  # Empty tag: the chart uses appVersion from Chart.yaml.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1
environment: Development

database:
  # SqlServer for real environments; InMemory only for demos and chart tests.
  provider: SqlServer
  # Name of an existing Secret with the connection string. The chart never creates it.
  existingSecret: ""
  secretKey: connection-string

# EF Core migration bundle, run as a pre-install/pre-upgrade hook (only with SqlServer).
migrations:
  enabled: true
  image:
    repository: helmseries-bookstore-migrations
    tag: ""
    pullPolicy: IfNotPresent
  backoffLimit: 1
  activeDeadlineSeconds: 300

# Non-secret settings; they reach the API as environment variables through a ConfigMap.
config:
  storeName: Bookstore

# Escape hatch for settings the chart does not model, e.g. Logging__LogLevel__Default: Debug
extraEnv: {}

service:
  type: ClusterIP
  port: 8080

probes:
  livePath: /health/live
  readyPath: /health/ready

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# bookstore-web (Angular build served by nginx; /api is proxied to the API Service)
web:
  enabled: true
  replicaCount: 1
  image:
    repository: helmseries-bookstore-web
    tag: ""
    pullPolicy: IfNotPresent
  # Rendered with tpl, so it may use template expressions.
  apiUpstream: 'http://{{ include "bookstore.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}'
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi

# Optional dependency (subchart). Its values go under its name; Bookstore.Api does not use it yet.
valkey:
  enabled: false
