<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Books by author with fetch</title>
</head>
<body>
  <label>Author: <input id="author" value="Jane Austen"></label>
  <button id="load">Load books</button>
  <p id="status"></p>
  <ul id="list"></ul>

  <script>
    const button = document.querySelector("#load");
    const statusEl = document.querySelector("#status");
    const list = document.querySelector("#list");

    async function getJSON(url) {
      const response = await fetch(url, { signal: AbortSignal.timeout(5000) });
      if (!response.ok) {
        throw new Error(`The server returned ${response.status}`);
      }
      return response.json();
    }

    button.addEventListener("click", async () => {
      const author = document.querySelector("#author").value;
      button.disabled = true;
      statusEl.textContent = "Loading...";
      list.replaceChildren();

      try {
        const result = await getJSON(
          `https://openlibrary.org/search.json?author=${encodeURIComponent(author)}&fields=title&limit=20`
        );
        if (result.docs.length === 0) {
          statusEl.textContent = "No books found for this author.";
          return;
        }
        for (const book of result.docs) {
          const li = document.createElement("li");
          li.textContent = book.title;
          list.append(li);
        }
        statusEl.textContent = `Found ${result.numFound} books, showing the first ${result.docs.length}.`;
      } catch (error) {
        statusEl.textContent = error.name === "TimeoutError"
          ? "The server is too slow, please try again."
          : `Something went wrong: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
