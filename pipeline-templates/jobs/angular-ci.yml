# Installs, tests and builds an Angular application, then publishes the build output as an artifact.
# With npmrc set, packages come through that registry (an Azure Artifacts feed) after npmAuthenticate.
parameters:
  - name: workingDirectory
    type: string
  - name: distDirectory
    type: string
  - name: nodeVersion
    type: string
    default: 24.x
  - name: npmrc
    type: string
    default: ''

jobs:
  - job: Web
    displayName: Build and test web
    dependsOn: Version
    steps:
      - checkout: self

      - task: UseNode@1
        displayName: Install Node.js ${{ parameters.nodeVersion }}
        inputs:
          version: ${{ parameters.nodeVersion }}

      - task: Cache@2
        displayName: Cache npm
        inputs:
          key: 'npm | "$(Agent.OS)" | ${{ parameters.workingDirectory }}/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(npm_config_cache)

      - ${{ if ne(parameters.npmrc, '') }}:
          - script: cp ${{ parameters.npmrc }} ${{ parameters.workingDirectory }}/.npmrc
            displayName: Use feed .npmrc

          - task: npmAuthenticate@0
            displayName: Authenticate to Azure Artifacts
            inputs:
              workingFile: ${{ parameters.workingDirectory }}/.npmrc

      - script: npm ci
        displayName: npm ci
        workingDirectory: ${{ parameters.workingDirectory }}

      - script: npm run test:ci
        displayName: Unit tests
        workingDirectory: ${{ parameters.workingDirectory }}

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: test-results/junit.xml
          searchFolder: ${{ parameters.workingDirectory }}
          testRunTitle: Web tests

      - script: npm run build
        displayName: Build
        workingDirectory: ${{ parameters.workingDirectory }}

      - task: PublishPipelineArtifact@1
        displayName: Upload web artifact
        inputs:
          targetPath: ${{ parameters.distDirectory }}
          artifact: web
