<h1>{{ title }}</h1>
<app-book-card></app-book-card>
<app-book-card></app-book-card>
<app-book-list></app-book-list>
<app-book-detail></app-book-detail>
<app-order-list></app-order-list>
<app-card>
  <h3 card-title>Dune</h3>
  <p>Frank Herbert's science fiction classic.</p>
  <div class="card-actions">
    <button>Add to cart</button>
  </div>
</app-card>
<app-card>
  <h3 #cardTitle>Order Summary</h3>
</app-card>
<app-order-tracking [orderId]="1042"></app-order-tracking>
<app-price-tag [price]="price"></app-price-tag>
<button (click)="price = price + 20">Raise price</button>
<button (click)="price = price - 20">Lower price</button>
<app-search-box></app-search-box>
<button (click)="showSale = !showSale">Show/Hide sale</button>
<app-sale-countdown *ngIf="showSale"></app-sale-countdown>
<button (click)="count = count + 1">Increment</button>
<button (click)="visible = !visible">Show/Hide</button>
<app-lifecycle-demo *ngIf="visible" [count]="count"></app-lifecycle-demo>
