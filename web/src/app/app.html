<header class="site-header">
  <h1 class="m-0">Bookstore</h1>
  <p class="m-0 text-muted d-none md:d-block">Classics, delivered</p>
  <app-theme-toggle />
</header>
<main class="page">
  <section class="book-list">
    @for (book of books; track book.isbn) {
      <app-book-card [book]="book" />
    }
  </section>
</main>
