<p *ngIf="orders.length === 0">No orders yet.</p>

<div *ngIf="!isLoading; else loading">
  There are {{ orders.length }} orders.
</div>

<ng-template #loading>
  <p>Loading orders...</p>
</ng-template>

<ul>
  <li *ngFor="let order of orders; let i = index; let first = first; let last = last; let even = even; trackBy: trackById"
      [class.first]="first" [class.last]="last" [class.even]="even"
      [ngClass]="{ 'delivered': order.status === 'delivered', 'express': order.shipping === 'express' }"
      [ngStyle]="{ 'opacity': order.status === 'delivered' ? 0.5 : 1 }"
      appHighlight>
    {{ i + 1 }}. {{ order.books }}
    <span [ngSwitch]="order.status">
      <span *ngSwitchCase="'pending'">Pending</span>
      <span *ngSwitchCase="'shipped'">Shipped</span>
      <span *ngSwitchCase="'delivered'">Delivered</span>
      <span *ngSwitchDefault>Unknown</span>
    </span>
  </li>
</ul>

<ul class="open-orders">
  <ng-container *ngFor="let order of orders; trackBy: trackById">
    <li *ngIf="order.status !== 'delivered'">{{ order.books }}</li>
  </ng-container>
</ul>
