<div class="admin-shell">
  <mat-toolbar>
    @if (handset()) {
      <button matIconButton type="button" aria-label="Open navigation" (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
    }
    <span class="title">Bookstore Admin</span>
    <span class="spacer"></span>
    <a matButton routerLink="/">Storefront</a>
    <button matButton type="button" cdkOverlayOrigin #userOrigin="cdkOverlayOrigin" aria-haspopup="dialog"
            [attr.aria-expanded]="accountOpen()" (click)="accountOpen.set(!accountOpen())">
      <mat-icon>account_circle</mat-icon>
      {{ user.name }}
    </button>
  </mat-toolbar>

  <!-- Declarative overlay: the directive turns this template into a TemplatePortal and attaches it -->
  <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="userOrigin" [cdkConnectedOverlayOpen]="accountOpen()"
               [cdkConnectedOverlayPositions]="accountPositions" (overlayOutsideClick)="closeAccount(userOrigin.elementRef.nativeElement, false)"
               (detach)="closeAccount(userOrigin.elementRef.nativeElement, true)" (attach)="focusFirst()"
               (overlayKeydown)="accountKeydown($event)">
    <section #accountPanel class="account-panel" role="dialog" aria-label="Account">
      <p class="name">{{ user.name }}</p>
      <p class="email">{{ user.email }}</p>
      <p class="role">{{ user.role }}</p>
      <a matButton routerLink="/admin/orders" (click)="accountOpen.set(false)">Orders</a>
      <a matButton routerLink="/" (click)="accountOpen.set(false)">Sign out</a>
    </section>
  </ng-template>

  <mat-sidenav-container class="container">
    <mat-sidenav #drawer [mode]="mode()" [opened]="!handset()">
      <mat-nav-list>
        @for (link of links; track link.path) {
          <a mat-list-item [routerLink]="link.path" routerLinkActive #active="routerLinkActive"
             [activated]="active.isActive" (click)="handset() && drawer.close()">
            <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
            <span matListItemTitle>{{ link.label }}</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      <main class="content">
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
