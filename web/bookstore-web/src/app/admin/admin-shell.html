<div class="admin-shell">
  <mat-toolbar>
    @if (handset()) {
      <button matIconButton type="button" aria-label="Open navigation" (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
    }
    <span class="title">Bookstore Admin</span>
    <span class="spacer"></span>
    <a matButton routerLink="/">Storefront</a>
  </mat-toolbar>

  <mat-sidenav-container class="container">
    <mat-sidenav #drawer [mode]="mode()" [opened]="!handset()">
      <mat-nav-list>
        @for (link of links; track link.path) {
          <a mat-list-item [routerLink]="link.path" routerLinkActive #active="routerLinkActive"
             [activated]="active.isActive" (click)="handset() && drawer.close()">
            <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
            <span matListItemTitle>{{ link.label }}</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      <main class="content">
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
