<!doctype html>
<html lang="en">
<head>

</head>

    <main class="catalog">
        <h1>Classics</h1>
        <ul class="book-list">
            <li class="book-card">

            <li class="book-card">

            <li class="book-card">
                <h2>Emma</h2>
                <p class="author">Jane Austen</p>

            </li>
            <li class="book-card">
                <h2>The Hobbit</h2>
                <p class="author">J. R. R. Tolkien</p>
                <p class="price">₺310.00</p>

</html>
