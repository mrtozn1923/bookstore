<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalog - Bookstore</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="catalog.html">Bookstore</a>
        <a class="cart-link" href="checkout.html">
            <svg class="icon icon-line cart-icon" aria-hidden="true"><use href="img/icons.svg#cart"/></svg>
            Cart <span class="cart-count">0</span>
        </a>
    </header>
    <main class="catalog">
        <h1>Classics</h1>
        <nav class="filter-bar" aria-label="Filters">
            <button type="button" aria-pressed="true">All</button>
            <button type="button" aria-pressed="false">In stock</button>
            <button type="button" aria-pressed="false">Under ₺300</button>
        </nav>
        <ul class="book-list">
            <li class="book-card featured">
                <span class="badge">New</span>
                <div class="cover"><img src="img/cover-dune.webp" alt="" width="240" height="360"></div>
                <h2><a href="book.html">Dune</a></h2>
                <p class="author">Frank Herbert</p>
                <p class="price"><svg class="icon" aria-hidden="true"><use href="img/icons.svg#tag"/></svg> ₺420.00</p>
                <button type="button" class="fav" aria-pressed="false" aria-label="Favorite: Dune"><svg class="icon icon-line" aria-hidden="true"><use href="img/icons.svg#heart"/></svg></button>
            </li>
            <li class="book-card">
                <div class="cover"><img src="img/cover-middlemarch.webp" alt="" width="240" height="360"></div>
                <h2><a href="book.html">Middlemarch</a></h2>
                <p class="author">George Eliot</p>
                <p class="price"><svg class="icon" aria-hidden="true"><use href="img/icons.svg#tag"/></svg> ₺385.50</p>
                <button type="button" class="fav" aria-pressed="false" aria-label="Favorite: Middlemarch"><svg class="icon icon-line" aria-hidden="true"><use href="img/icons.svg#heart"/></svg></button>
            </li>
            <li class="book-card">
                <div class="cover"><img src="img/cover-emma.webp" alt="" width="240" height="360"></div>
                <h2><a href="book.html">Emma</a></h2>
                <p class="author">Jane Austen</p>
                <p class="price"><svg class="icon" aria-hidden="true"><use href="img/icons.svg#tag"/></svg> ₺240.00</p>
                <button type="button" class="fav" aria-pressed="false" aria-label="Favorite: Emma"><svg class="icon icon-line" aria-hidden="true"><use href="img/icons.svg#heart"/></svg></button>
            </li>
            <li class="book-card is-sold-out">
                <span class="badge">Sold out</span>
                <div class="cover"><img src="img/cover-hobbit.webp" alt="" width="240" height="360"></div>
                <h2><a href="book.html">The Hobbit</a></h2>
                <p class="author">J. R. R. Tolkien</p>
                <p class="price"><svg class="icon" aria-hidden="true"><use href="img/icons.svg#tag"/></svg> ₺310.00</p>
                <button type="button" class="fav" aria-pressed="false" aria-label="Favorite: The Hobbit"><svg class="icon icon-line" aria-hidden="true"><use href="img/icons.svg#heart"/></svg></button>
            </li>
        </ul>
    </main>
    <script src="js/favorite.js" defer></script>
</body>
</html>
