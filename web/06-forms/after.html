<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - Bookstore</title>
  <link rel="stylesheet" href="/web/styles/base.css">
  <link rel="stylesheet" href="/web/styles/tokens.css">
  <link rel="stylesheet" href="after.css">
</head>
<body>
  <main>
    <h1>Delivery details</h1>
    <p class="guest">You are checking out as a guest. <a href="#">Sign in</a> if you have an account.</p>
    <div id="summary" class="summary" tabindex="-1" hidden>
      <h2>Check these fields</h2>
      <ul></ul>
    </div>
    <form id="checkout" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <p class="hint" id="email-hint">We send the order confirmation here</p>
        <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-hint" required>
      </div>
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="address">Street address</label>
        <input id="address" name="address" autocomplete="street-address" required>
      </div>
      <div class="field">
        <label for="city">City</label>
        <input id="city" name="city" autocomplete="address-level2" required>
      </div>
      <div class="field">
        <label for="postcode">Postcode</label>
        <input id="postcode" name="postcode" class="short" inputmode="numeric" autocomplete="postal-code" required>
      </div>
      <div class="field">
        <label for="phone">Phone number (optional)</label>
        <p class="hint" id="phone-hint">Only the courier uses it, on delivery day</p>
        <input id="phone" name="phone" type="tel" autocomplete="tel" aria-describedby="phone-hint">
      </div>
      <label class="check"><input type="checkbox" id="sameBilling" checked> Billing address is the same as delivery address</label>
      <label class="check"><input type="checkbox" id="saveDetails"> Save my details for next time</label>
      <div class="field" id="passwordField" hidden>
        <label for="password">Create a password</label>
        <p class="hint" id="password-hint">At least 10 characters. You can paste one from your password manager.</p>
        <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-hint">
      </div>
      <button type="submit" class="btn">Continue to payment</button>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script src="after.js"></script>
</body>
</html>
