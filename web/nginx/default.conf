server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # SPA fallback: unknown paths go to index.html, the Angular router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File names carry a content hash, so they can be cached for a year
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Must never be cached: they change without a file name change
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Same origin for the API: /api/books -> http://bookstore-api:8080/books on the container network.
    # Docker's embedded DNS (127.0.0.11) resolves the name per request, so nginx starts without the API.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://bookstore-api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
    }

    # Written to /tmp at startup (40-runtime-config.sh), not into the read-only web root
    location = /config.json {
        root /tmp;
        add_header Cache-Control "no-store";
    }
}
