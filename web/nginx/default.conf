server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # SPA fallback: unknown paths go to index.html, the Angular router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File names carry a content hash, so they can be cached for a year
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Must never be cached: they change without a file name change
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /config.json {
        add_header Cache-Control "no-store";
    }
}
