<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classics - Bookstore</title>
  <link rel="stylesheet" href="/web/styles/base.css">
  <link rel="stylesheet" href="/web/styles/tokens.css">
  <link rel="stylesheet" href="after.css">
</head>
<body>
  <main class="catalog">
    <header class="catalog-header">
      <h1>Classics</h1>
      <p class="count">6 books</p>
    </header>
    <div class="grid">
      <article class="card">
        <img src="/web/assets/cover-dune.svg" alt="" width="240" height="360">
        <h2 class="title">Dune</h2>
        <p class="author">Frank Herbert</p>
        <p class="price">₺420.00</p>
        <button class="btn">Add to cart</button>
      </article>
      <article class="card">
        <img src="/web/assets/cover-emma.svg" alt="" width="240" height="360">
        <h2 class="title">Emma</h2>
        <p class="author">Jane Austen</p>
        <p class="price">₺199.90</p>
        <button class="btn">Add to cart</button>
      </article>
      <article class="card">
        <img src="/web/assets/cover-middlemarch.svg" alt="" width="240" height="360">
        <h2 class="title">Middlemarch</h2>
        <p class="author">George Eliot</p>
        <p class="price">₺310.00</p>
        <button class="btn">Add to cart</button>
      </article>
      <article class="card">
        <img src="/web/assets/cover-hobbit.svg" alt="" width="240" height="360">
        <h2 class="title">The Hobbit</h2>
        <p class="author">J. R. R. Tolkien</p>
        <p class="price">₺415.00</p>
        <button class="btn">Add to cart</button>
      </article>
      <article class="card">
        <img src="/web/assets/cover-persuasion.svg" alt="" width="240" height="360">
        <h2 class="title">Persuasion</h2>
        <p class="author">Jane Austen</p>
        <p class="price">₺185.00</p>
        <button class="btn">Add to cart</button>
      </article>
      <article class="card">
        <img src="/web/assets/cover-jane-eyre.svg" alt="" width="240" height="360">
        <h2 class="title">Jane Eyre</h2>
        <p class="author">Charlotte Brontë</p>
        <p class="price">₺240.00</p>
        <button class="btn">Add to cart</button>
      </article>
    </div>
  </main>
</body>
</html>
