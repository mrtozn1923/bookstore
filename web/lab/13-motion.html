<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Lab 13: transitions, easing and keyframes</title>
    <style>
        /* self-contained: this lab does not load main.css */
        body { margin: 0; }
        .track { inline-size: 100px; block-size: 10px; }

        /* 1) the same 1s move with six timing functions */
        .track { translate: 0 0; transition: translate 1s var(--easing); }
        .moved .track { translate: 100px 0; }
        #linear { --easing: linear; }
        #ease { --easing: ease; }
        #ease-out { --easing: ease-out; }
        #overshoot { --easing: cubic-bezier(0.34, 1.56, 0.64, 1); }
        #steps { --easing: steps(4, end); }
        /* a spring-like curve: linear() joins the points with straight lines */
        #spring { --easing: linear(0, 0.7 25%, 1.08 45%, 0.97 65%, 1.01 82%, 1); }

        /* 2) a transition reverses from where it is; an animation starts again */
        .chip { opacity: 0.2; transition: opacity 1s linear; }
        .chip.on { opacity: 1; }

        /* 3) keyframes: delay and fill-mode */
        @keyframes bump {
            from { scale: 1.5; }
            to { scale: 1; }
        }
        .count { display: inline-block; animation: bump 400ms ease-out 200ms; }
        .count.backwards { animation-fill-mode: backwards; }
    </style>
</head>
<body>
    <div id="easings">
        <div class="track" id="linear"></div>
        <div class="track" id="ease"></div>
        <div class="track" id="ease-out"></div>
        <div class="track" id="overshoot"></div>
        <div class="track" id="steps"></div>
        <div class="track" id="spring"></div>
    </div>
    <div class="chip" id="chip">In stock</div>
    <span class="count" id="count-none">1</span>
    <span class="count backwards" id="count-backwards">1</span>
</body>
</html>
