<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Lab 04: sticky toolbar</title>
    <style>
        /* self-contained: this lab does not load main.css */
        body { margin: 0; }
        ul { list-style: none; margin: 0; padding: 0; }
        .site-header { position: sticky; inset-block-start: 0; block-size: 56px; background: #1f2937; }
        .catalog { overflow-x: hidden; }
        .catalog-toolbar { position: sticky; inset-block-start: 56px; background: #fef3c7; }
        .book-card { block-size: 200px; }
    </style>
</head>
<body>
    <header class="site-header"></header>
    <main class="catalog">
        <div class="catalog-toolbar">Sort by: price</div>
        <ul class="book-list">
            <li class="book-card">Dune</li>
            <li class="book-card">Middlemarch</li>
            <li class="book-card">Emma</li>
            <li class="book-card">The Hobbit</li>
            <li class="book-card">Jane Eyre</li>
            <li class="book-card">Ulysses</li>
        </ul>
    </main>
</body>
</html>
