<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout | Bookstore</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <main class="checkout">
        <h1>Checkout</h1>
        <form class="checkout-form" action="/orders" method="post">
            <div class="form-row">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
            </div>
            <div class="form-row">
                <label for="postcode">Postcode</label>
                <input id="postcode" name="postcode" required pattern="[0-9]{5}">
            </div>
            <div class="form-row">
                <label for="coupon">Coupon code</label>
                <div class="input-group">
                    <input id="coupon" name="coupon">
                    <button class="btn" type="button">Apply</button>
                </div>
            </div>
            <details class="gift-options">
                <summary>Gift options</summary>
                <label><input type="checkbox" name="gift-wrap"> Gift wrap</label>
            </details>
            <button class="btn btn-primary" type="submit">Place order</button>
        </form>
    </main>
</body>
</html>
