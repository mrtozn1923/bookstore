<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New arrivals - Bookstore</title>
  <link rel="stylesheet" href="/web/styles/base.css">
  <link rel="stylesheet" href="/web/styles/tokens.css">
  <link rel="stylesheet" href="after.css">
</head>
<body>
  <main>
    <h1>New arrivals</h1>
    <div class="grid">
    <article class="card">
      <img src="/web/assets/cover-dune.svg" alt="" width="240" height="360">
      <h2>Dune</h2>
      <p class="author">Frank Herbert</p>
      <p class="price">₺420.00</p>
      <p class="stock in"><span aria-hidden="true">✓</span> In stock</p>
      <button class="btn">Add to cart</button>
    </article>
    <article class="card">
      <img src="/web/assets/cover-emma.svg" alt="" width="240" height="360">
      <span class="badge">Sale</span>
      <h2>Emma</h2>
      <p class="author">Jane Austen</p>
      <p class="price">₺199.90 <s>₺249.90</s></p>
      <p class="stock low"><span aria-hidden="true">!</span> Only 2 left</p>
      <button class="btn">Add to cart</button>
    </article>
    <article class="card">
      <img src="/web/assets/cover-middlemarch.svg" alt="" width="240" height="360">
      <h2>Middlemarch</h2>
      <p class="author">George Eliot</p>
      <p class="price">₺310.00</p>
      <p class="stock out"><span aria-hidden="true">✕</span> Out of stock</p>
      <button class="btn">Notify me</button>
    </article>
    </div>
  </main>
</body>
</html>
