<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart bar from Auto Layout - Bookstore</title>
  <link rel="stylesheet" href="/web/styles/base.css">
  <link rel="stylesheet" href="/web/styles/generated/tokens.css">
  <style>
    body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); }
    #root { position: fixed; left: 0; right: 0; bottom: 0; display: flex; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { toCss, declarations } from '/scripts/lib/autolayout.mjs';
    const [node, vars] = await Promise.all(['cart-bar.figma.json', 'variables.figma.json'].map((f) => fetch(f).then((r) => r.json())));
    const variables = vars.meta.variables;
    // build the DOM from the Figma node tree; every frame and text gets the CSS its Auto Layout describes
    const build = (n, parent) => {
      const el = document.createElement(n.type === 'TEXT' ? 'span' : 'div');
      el.dataset.name = n.name;
      el.style.cssText = declarations(toCss(n, variables, parent).css);
      if (n.characters) el.textContent = n.characters;
      for (const child of n.children ?? []) el.append(build(child, n));
      return el;
    };
    document.querySelector('#root').append(build(node, { layoutMode: 'HORIZONTAL' }));
    document.body.dataset.ready = 'true';
  </script>
</body>
</html>
