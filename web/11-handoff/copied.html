<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart bar, copied values - Bookstore</title>
  <link rel="stylesheet" href="/web/styles/base.css">
  <link rel="stylesheet" href="/web/styles/generated/tokens.css">
  <style>
    body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); }
    /* sizes and colours copied as they appear in a 390 px design frame */
    .cart-bar { position: fixed; bottom: 0; left: 0; width: 390px; height: 72px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: #FFFFFF; }
    .count { font-size: 14px; color: #6B6F75; }
    .total { font-size: 16px; font-weight: 700; color: #202224; }
    .checkout { width: 138px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #3366D6; color: #FFFFFF; font-weight: 600; }
  </style>
</head>
<body data-ready="true">
  <div class="cart-bar" data-name="CartBar">
    <div data-name="Summary"><div class="count">2 books</div><div class="total">₺619.90</div></div>
    <div class="checkout" data-name="Checkout">Checkout</div>
  </div>
</body>
</html>
