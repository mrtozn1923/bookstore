<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas</title>
  <style>canvas { border: 1px solid #ccc; }</style>
</head>
<body>
  <canvas id="canvas" width="400" height="250">Your browser doesn't support canvas.</canvas>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#2563eb";
    ctx.fillRect(20, 20, 120, 80);

    ctx.strokeStyle = "crimson";
    ctx.lineWidth = 4;
    ctx.strokeRect(170, 20, 120, 80);

    ctx.clearRect(50, 40, 40, 40);
  </script>
</body>
</html>
