<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sold-out cover</title>
  <style>canvas { display: block; margin-top: 12px; border: 1px solid #ccc; }</style>
</head>
<body>
  <input type="file" id="picker" accept="image/*">
  <button id="gray" disabled>Show as sold out</button>
  <canvas id="canvas" width="400" height="300"></canvas>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const grayButton = document.getElementById("gray");

    document.getElementById("picker").addEventListener("change", async (event) => {
      const img = new Image();
      img.src = URL.createObjectURL(event.target.files[0]);
      await img.decode(); // if we draw before the image is ready, nothing shows up
      URL.revokeObjectURL(img.src);

      const ratio = Math.min(canvas.width / img.naturalWidth, canvas.height / img.naturalHeight);
      const w = img.naturalWidth * ratio;
      const h = img.naturalHeight * ratio;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
      grayButton.disabled = false;
    });

    grayButton.addEventListener("click", () => {
      const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = image.data; // R, G, B, A, R, G, B, A, ...

      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        d[i] = d[i + 1] = d[i + 2] = gray;
      }
      ctx.putImageData(image, 0, 0);
    });
  </script>
</body>
</html>
