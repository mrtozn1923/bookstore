apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  appsettings.Production.json: |
    {
      "Catalog": {
        "PageSize": 20,
        "MaxPageSize": 100
      },
      "Shipping": {
        "DefaultCountry": "NO"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: bookstore-api
    app.kubernetes.io/version: "1.10"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bookstore-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookstore-api
    spec:
      containers:
        - name: api
          # the release pipeline updates this tag with yq
          image: bookstore-api:1.11.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Shipping__DefaultCountry
              value: "NO"
            - name: Catalog__PageSize
              value: "20"
          volumeMounts:
            - name: config
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
          resources:
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: api-config
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: bookstore-api
  ports:
    - name: http
      port: 80
      targetPort: http
