apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: bookstore-api
    app.kubernetes.io/version: "1.10"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bookstore-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookstore-api
    spec:
      containers:
        - name: api
          image: bookstore-api:1.10.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Shipping__DefaultCountry
              value: "NO"
            - name: Catalog__PageSize
              value: "20"
          resources:
            limits:
              memory: 512Mi
