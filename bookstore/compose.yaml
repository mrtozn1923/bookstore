name: bookstore

services:
  api:
    build: .
    image: bookstore-api:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Shipping__DefaultCountry: "NO"
      Shipping__ApiVersion: "1.10"
      Catalog__PageSize: "20"
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - db-data:/var/opt/mssql

volumes:
  db-data:
