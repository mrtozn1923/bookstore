<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search with debounce</title>
</head>
<body>
  <input id="search" placeholder="Search books...">
  <p id="status"></p>

  <script>
    function debounce(fn, ms) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), ms);
      };
    }

    let keyCount = 0;
    let searchCount = 0;
    const status = document.querySelector("#status");

    function update() {
      status.textContent = `${keyCount} keys, ${searchCount} searches`;
    }

    const search = debounce((text) => {
      searchCount++;
      console.log("Searching:", text);
      update();
    }, 300);

    document.querySelector("#search").addEventListener("input", (e) => {
      keyCount++;
      update();
      search(e.target.value);
    });
  </script>
</body>
</html>
