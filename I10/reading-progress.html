<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reading progress</title>
  <style>
    #bar { position: fixed; top: 0; left: 0; height: 6px; width: 0; background: tomato; }
    main { height: 400vh; padding: 20px; }
  </style>
</head>
<body>
  <div id="bar"></div>
  <main>Dune, sample chapter. Scroll down...</main>

  <script>
    const bar = document.querySelector("#bar");
    let scheduled = false;

    function updateBar() {
      scheduled = false;
      const total = document.documentElement.scrollHeight - innerHeight;
      bar.style.width = `${(scrollY / total) * 100}%`;
    }

    window.addEventListener("scroll", () => {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(updateBar);
    }, { passive: true });
  </script>
</body>
</html>
