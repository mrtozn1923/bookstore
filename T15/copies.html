<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Copies</title>
</head>
<body>
  <h1>Dune</h1>
  <button id="add-copy">Add a copy</button>
  <p>Copies: <span id="count">0</span></p>
  <script>
    const button = document.getElementById("add-copy");
    const countArea = document.getElementById("count");
    let copies = 0;

    function addCopy() {
      copies = copies + 1;
      countArea.textContent = copies;
    }

    button.addEventListener("click", addCopy);
    button.addEventListener("click", () => console.log("Clicked"));
  </script>
</body>
</html>
