# Rules from ADR-0001 that a linter can check.
extends: ["spectral:oas"]
overrides:
  # ADR-0003: the problem type catalog is small and bounded; it is not paginated.
  - files: ["contract/bookstore.openapi.yaml#/paths/~1problems/get"]
    rules:
      bookstore-paginated-lists: "off"
rules:
  bookstore-path-kebab-case:
    description: Path segments are lowercase kebab-case; parameters are camelCase; an optional :customMethod ends the path.
    message: "Path is not kebab-case: {{property}}"
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        match: "^(/([a-z0-9]+(-[a-z0-9]+)*|\\{[a-z][a-zA-Z0-9]*\\}))+(:[a-z][a-zA-Z]*)?$"
  bookstore-no-verbs-in-path:
    description: Resources are nouns; CRUD verbs do not belong in the URL.
    message: "Verb in path: {{property}}"
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        notMatch: "/(get|list|create|add|update|save|delete|remove)([A-Z/-]|$)"
  bookstore-max-two-path-params:
    description: At most two path parameters (BS-05); deeper hierarchies use query filters.
    message: "Too deep: {{property}}"
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        notMatch: "(\\{[^}]+\\}.*){3,}"
  bookstore-errors-are-problem-details:
    description: Every 4xx and 5xx response with a body is application/problem+json (BS-20).
    message: "{{path}} must use application/problem+json"
    severity: error
    given: $.paths[*][?(@property != 'head' && @property != 'parameters')].responses[?(@property.match(/^[45]/))]
    then:
      field: content.application/problem+json
      function: truthy
  bookstore-paginated-lists:
    description: Every list operation takes pageSize and pageToken from its first version (BS-30).
    message: "{{path}} is a list without pageSize and pageToken"
    severity: error
    given: $.paths[*][?(@property === 'get' && @.operationId && @.operationId.match(/^list/))]
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          allOf:
            - contains: {properties: {name: {const: pageSize}}, required: [name]}
            - contains: {properties: {name: {const: pageToken}}, required: [name]}
