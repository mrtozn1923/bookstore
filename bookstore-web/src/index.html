<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bookstore</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Analytics after the load event: it no longer competes with main.js for bandwidth
    addEventListener('load', () => {
      const script = document.createElement('script');
      script.src = 'http://analytics.thirdparty.test:5302/analytics.js';
      document.head.append(script);
    });
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
