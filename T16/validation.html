<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Validation</title>
  <style>
    .error { color: firebrick; font-size: 14px; }
    .invalid { border: 2px solid firebrick; }
  </style>
</head>
<body>
  <form id="signup" novalidate>
    <p>
      <label for="name">Name</label>
      <input id="name">
      <span class="error" id="name-error"></span>
    </p>
    <p>
      <label for="email">Email</label>
      <input id="email" type="email">
      <span class="error" id="email-error"></span>
    </p>
    <p>
      <label for="password">Password</label>
      <input id="password" type="password">
      <span class="error" id="password-error"></span>
    </p>
    <p>
      <label><input id="terms" type="checkbox"> I accept the terms of use</label>
      <span class="error" id="terms-error"></span>
    </p>
    <button>Sign up</button>
  </form>
  <p id="result"></p>
  <script>
    const form = document.getElementById("signup");
    const result = document.getElementById("result");

    function checkName(name) {
      if (name === "") return "Name can't be empty.";
      if (name.length < 2) return "Name must be at least 2 characters.";
      return "";
    }

    function checkEmail(email) {
      if (email === "") return "Email can't be empty.";
      if (!email.includes("@") || !email.includes(".")) {
        return "Enter a valid email address.";
      }
      return "";
    }

    function checkPassword(password) {
      if (password.length < 8) return "Password must be at least 8 characters.";
      return "";
    }

    function showError(fieldId, message) {
      document.getElementById(fieldId + "-error").textContent = message;
      document.getElementById(fieldId).classList.toggle("invalid", message !== "");
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const nameError = checkName(document.getElementById("name").value.trim());
      const emailError = checkEmail(document.getElementById("email").value.trim());
      const passwordError = checkPassword(document.getElementById("password").value);
      const termsError = document.getElementById("terms").checked
        ? ""
        : "You need to accept the terms to continue.";

      showError("name", nameError);
      showError("email", emailError);
      showError("password", passwordError);
      showError("terms", termsError);

      if (nameError || emailError || passwordError || termsError) {
        result.textContent = "";
        return;
      }

      result.textContent = "Signed up successfully, welcome!";
      form.reset();
    });
  </script>
</body>
</html>
