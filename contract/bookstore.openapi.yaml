openapi: 3.2.0
info:
  title: Bookstore API
  version: 0.1.0
  summary: Public and partner HTTP API of Bookstore.
  description: >-
    Contract for the Bookstore catalog and ordering API. Design rules are in
    docs/adr/0001-api-style-guide.md.
  contact:
    name: Bookstore API team
    email: api-team@example.com
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.com
    description: Placeholder; the real host is not part of the samples.
security:
  - bearerAuth: []
tags:
  - name: Problems
    description: The catalog of error types.
  - name: Books
    description: Catalog books.
  - name: Orders
    description: Orders of individual and institutional customers.
  - name: Carts
    description: Shopping carts.
  - name: Institutions
    description: Institutional customers (schools, libraries, companies).
  - name: Operations
    description: Status monitors of long-running operations.
paths:
  /books:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listBooks
      summary: List books
      description: >-
        One page of the catalog, sorted by title unless sort says otherwise; the
        ISBN breaks ties. Unknown query parameters return 400.
      tags: [Books]
      security: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
            examples: [classics]
        - name: author
          in: query
          description: Exact name of one of the authors, case-insensitive.
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: inStock
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          description: Free text searched in title and author.
          schema:
            type: string
        - name: sort
          in: query
          description: "Comma-separated fields, '-' for descending; allowed: title, author, price."
          schema:
            type: string
            default: title
            examples: ['-price,title']
        - name: fields
          in: query
          description: >-
            Comma-separated subset of isbn, title, authors, category, price, inStock,
            description (and author in 2026-09-01). Items contain only these members.
          schema:
            type: string
            examples: ['isbn,title,price']
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: One page of books.
          headers:
            Link:
              $ref: '#/components/headers/NextLink'
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookList'
        '400':
          $ref: '#/components/responses/Problem'
    query:
      operationId: lookupBooks
      summary: Look up books by ISBN
      description: >-
        HTTP QUERY (RFC 10008): safe and idempotent like GET, with the ISBN list
        in the body. At most 500 ISBNs; unknown ISBNs are left out of items.
      tags: [Books]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isbns]
              properties:
                isbns:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                    pattern: '^97[89][0-9]{10}$'
      responses:
        '200':
          description: The books that exist, in no particular order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookList'
        '400':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createBook
      summary: Add a book to the catalog
      description: StoreStaff only. A book with the same ISBN returns 409.
      tags: [Books]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      responses:
        '201':
          description: The book was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /books/{isbn}:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/Isbn'
    get:
      operationId: getBook
      summary: Get a book
      description: Returns one book by its ISBN-13. HEAD returns the same headers without a body.
      tags: [Books]
      security: []
      responses:
        '200':
          description: The book.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Api-Version:
              $ref: '#/components/headers/ApiVersion'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/Problem'
    head:
      operationId: headBook
      summary: Check a book
      description: Same as GET without a body; used to read the ETag cheaply.
      tags: [Books]
      security: []
      responses:
        '200':
          description: The book exists.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          description: No such book.
    put:
      operationId: replaceBook
      summary: Create or replace a book
      description: >-
        StoreStaff only. Replaces every writable field; creates the book (201) when
        the ISBN is new. Replacing an existing book requires If-Match (428 without it,
        412 when stale); creating does not.
      tags: [Books]
      parameters:
        - name: If-Match
          in: header
          description: ETag from a previous GET; required when the book exists.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookFields'
      responses:
        '200':
          description: The book was replaced.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '201':
          description: The book was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateBook
      summary: Update some fields of a book
      description: >-
        StoreStaff only. JSON Merge Patch (RFC 7396): a member set to null is removed,
        objects are merged, everything else is replaced. Read-only fields return 400.
      tags: [Books]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/BookPatch'
      responses:
        '200':
          description: The updated book.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '415':
          description: The patch is not application/merge-patch+json.
          headers:
            Accept-Patch:
              description: The patch formats this resource accepts.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteBook
      summary: Remove a book from the catalog
      description: StoreStaff only. A second DELETE returns 404.
      tags: [Books]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The book was removed.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /orders:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listOrders
      summary: List my orders
      description: Orders of the calling individual customer, newest first.
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: One page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createOrder
      summary: Place an order
      description: >-
        Customer only. Creates an order from the given lines (ADR-0005). The
        Idempotency-Key makes a retry after a timeout or a lost response safe.
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: The order was created (or this is a retry of the request that created it).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      summary: Get an order
      description: >-
        The canonical URL of an order. Orders the caller may not see return 404,
        exactly like orders that do not exist.
      tags: [Orders]
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /orders/{orderId}:cancel:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: cancelOrder
      summary: Cancel an order
      description: Custom method (BS-03). Only Pending or Confirmed orders can be cancelled.
      tags: [Orders]
      responses:
        '200':
          description: The cancelled order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /orders/{orderId}/returns:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: createReturn
      summary: Request a return
      description: >-
        A return has its own lifecycle (Requested, Approved, Rejected, Refunded),
        so it is a resource, not a custom method (BS-04).
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReturnRequest'
      responses:
        '201':
          description: The return request was created.
          headers:
            Location:
              description: URL of the new return.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /orders/{orderId}/returns/{returnId}:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/OrderId'
      - name: returnId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getReturn
      summary: Get a return
      description: Returns one return request of an order.
      tags: [Orders]
      responses:
        '200':
          description: The return.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /orders/{orderId}/invoices:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: generateInvoice
      summary: Generate the invoice PDF
      description: >-
        Long-running (ADR-0005): returns 202 with the status monitor in the body and
        its URL in Operation-Location. Poll it no faster than Retry-After. One invoice
        per order; a second request gets 409 invoice-already-requested with
        operationLocation.
      tags: [Orders]
      responses:
        '202':
          description: Accepted; the invoice is being generated.
          headers:
            Operation-Location:
              $ref: '#/components/headers/OperationLocation'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /orders/{orderId}/invoices/{invoiceId}:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/OrderId'
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getInvoice
      summary: Download an invoice
      description: The PDF that generateInvoice produced; its URL is the operation's resourceLocation.
      tags: [Orders]
      responses:
        '200':
          description: The invoice.
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /operations/{operationId}:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/OperationId'
    get:
      operationId: getOperation
      summary: Get the status of a long-running operation
      description: >-
        Visible only to the caller who started it. Kept for 24 hours after it ends,
        then 404. While it runs, the response carries Retry-After.
      tags: [Operations]
      responses:
        '200':
          description: The status monitor.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /operations/{operationId}:cancel:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/OperationId'
    post:
      operationId: cancelOperation
      summary: Cancel a running operation
      description: Ends a NotStarted or Running operation as Canceled; an ended one returns 409.
      tags: [Operations]
      responses:
        '200':
          description: The operation is cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /customers/{customerId}/cart:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: getCart
      summary: Get a cart
      description: The cart is a singleton sub-resource of a customer. Use "me" for the caller.
      tags: [Carts]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: The cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /customers/{customerId}/cart/items/{isbn}:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/Isbn'
    put:
      operationId: setCartItem
      summary: Set the quantity of a cart line
      description: >-
        Creates the line (201) or replaces its quantity (200). Sending the same request
        twice leaves the same cart. A quantity above the available stock returns 422.
      tags: [Carts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCartItemRequest'
      responses:
        '200':
          description: The line was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '201':
          description: The line was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeCartItem
      summary: Remove a cart line
      description: Removes the line; a line that is not in the cart returns 404.
      tags: [Carts]
      responses:
        '204':
          description: The line was removed.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /institutions/{institutionId}:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: getInstitution
      summary: Get an institution
      description: Returns the caller's institution with its units.
      tags: [Institutions]
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
      responses:
        '200':
          description: The institution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institution'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /institutions/{institutionId}/orders:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listInstitutionOrders
      summary: List an institution's orders
      description: >-
        A filtered view of the orders collection. Items link to their canonical
        URL /orders/{orderId}; there is no /institutions/{institutionId}/orders/{orderId}.
      tags: [Institutions]
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
        - name: unitId
          in: query
          description: Only orders of this unit. Buyers can only ask for their own unit.
          schema:
            type: string
        - name: status
          in: query
          description: Comma-separated statuses, case-sensitive, e.g. Confirmed,Shipped.
          schema:
            type: string
        - name: createdAfter
          in: query
          description: Inclusive lower bound, RFC 3339.
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          description: Exclusive upper bound, RFC 3339.
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          description: createdAt or total, '-' for descending; the order id breaks ties.
          schema:
            type: string
            default: -createdAt
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: One page of orders.
          headers:
            Link:
              $ref: '#/components/headers/NextLink'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /institutions/{institutionId}/order-batches:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/InstitutionId'
    post:
      operationId: createOrderBatch
      summary: Place a bulk order
      description: >-
        Up to 500 lines for one unit (ADR-0006). Schema errors reject the whole batch
        (400, errors keyed by JSON path such as lines[3].quantity). Business rules are
        checked per line: rejected lines are reported in results and the accepted lines
        become one Pending order at the institutional price (10% off). With
        allOrNothing, any rejected line means no order (422 batch-rejected). With
        Prefer: respond-async the batch runs as a long-running operation (202). Quota:
        5 batches per minute per institution (RateLimit-Policy "batches").
      tags: [Institutions]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: Prefer
          in: header
          description: respond-async (RFC 7240) to get 202 and a status monitor.
          schema:
            type: string
            examples: [respond-async]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderBatchRequest'
      responses:
        '201':
          description: An order was created from the accepted lines; results lists every line.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBatchReport'
        '202':
          description: Accepted (Prefer respond-async); the report is the operation's resourceLocation.
          headers:
            Operation-Location:
              $ref: '#/components/headers/OperationLocation'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Preference-Applied:
              description: respond-async when the preference was honoured.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          description: Quota exceeded (quota-exceeded, violatedPolicies).
          headers:
            Retry-After:
              description: Seconds until the quota window resets.
              schema:
                type: integer
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /institutions/{institutionId}/order-batches/{batchId}:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/InstitutionId'
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOrderBatch
      summary: Get the report of a bulk order
      description: The line-by-line report of a batch, for the institution's users.
      tags: [Institutions]
      responses:
        '200':
          description: The batch report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBatchReport'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /problems:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listProblemTypes
      summary: List problem types
      description: Every problem type the API can return, with its localized title.
      tags: [Problems]
      security: []
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProblemType'
  /problems/{code}:
    parameters:
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: getProblemType
      summary: Describe a problem type
      description: Human-readable page that a problem's type URI resolves to.
      tags: [Problems]
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Documentation page.
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Problem'
webhooks:
  orderBatchCompleted:
    post:
      operationId: orderBatchCompletedWebhook
      summary: A bulk order finished (planned)
      description: >-
        Planned (ADR-0006), not sent yet. Bookstore will POST this event to the URL an
        institution registers, signed as described in the webhook documentation.
        Receivers answer 2xx quickly and fetch the report from links.report; until
        then, poll the operation.
      tags: [Institutions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, occurredAt, data]
              properties:
                id:
                  type: string
                  description: Unique event id; receivers use it to drop duplicates.
                type:
                  type: string
                  const: order-batch.completed
                occurredAt:
                  type: string
                  format: date-time
                data:
                  type: object
                  required: [batchId, institutionId, acceptedLines, rejectedLines, links]
                  properties:
                    batchId:
                      type: string
                      format: uuid
                    institutionId:
                      type: string
                    acceptedLines:
                      type: integer
                    rejectedLines:
                      type: integer
                    links:
                      type: object
                      properties:
                        report:
                          type: string
                          format: uri-reference
      responses:
        '204':
          description: Received.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  headers:
    ApiVersion:
      description: The api-version that produced this response.
      schema:
        type: string
    Deprecation:
      description: RFC 9745 structured field date (@epoch-seconds) on responses of a deprecated version.
      schema:
        type: string
    Sunset:
      description: RFC 8594 HTTP-date after which the deprecated version stops answering.
      schema:
        type: string
    OperationLocation:
      description: URL of the status monitor (GET /operations/{operationId}).
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Seconds to wait before polling the status monitor again.
      schema:
        type: integer
    RateLimitPolicy:
      description: >-
        draft-ietf-httpapi-ratelimit-headers-11 quota policy, e.g. "batches";q=5;w=60
        (5 requests per 60 seconds). Informative; the draft may still change.
      schema:
        type: string
    RateLimit:
      description: >-
        draft-ietf-httpapi-ratelimit-headers-11 remaining quota, e.g. "batches";r=4;t=57
        (4 requests left for the next 57 seconds).
      schema:
        type: string
    NextLink:
      description: RFC 8288 link to the next page, rel="next"; absent on the last page.
      schema:
        type: string
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri-reference
    ETag:
      description: Current version of the representation.
      schema:
        type: string
  parameters:
    ApiVersion:
      name: api-version
      in: query
      description: >-
        Dated contract version (ADR-0004). Absent means the oldest supported version,
        2026-09-01, until its sunset. Responses carry Api-Version; a deprecated version
        also gets Deprecation (RFC 9745), Sunset (RFC 8594) and a Link rel="deprecation".
        Unknown versions return 400 unsupported-api-version.
      schema:
        type: string
        enum: ['2026-09-01', '2026-11-15']
        default: '2026-09-01'
    Isbn:
      name: isbn
      in: path
      required: true
      description: ISBN-13 without dashes.
      schema:
        type: string
        pattern: '^97[89][0-9]{10}$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        ETag from a previous GET. Required for every change to an existing resource:
        missing returns 428 precondition-required, a mismatch returns 412.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        draft-ietf-httpapi-idempotency-key-header-08: a Structured Field String (in
        quotes), unique per request, e.g. a UUID. Scoped to the caller and the operation,
        kept for 24 hours. Same key and body: the first response is returned again.
        Same key, different body: 422 idempotency-key-reused. First request still
        running: 409 idempotency-key-in-progress. Missing: 400 idempotency-key-missing.
      schema:
        type: string
        pattern: '^"[ -~]{1,255}"$'
        examples: ['"5f0c6e1a-8b2d-4c3e-9a71-2d4b8e6f1c90"']
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      description: Customer id, or "me" for the caller.
      schema:
        type: string
    InstitutionId:
      name: institutionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{1,62}$'
    PageSize:
      name: pageSize
      in: query
      description: >-
        Maximum number of items in the page. Absent or 0 means 10; values above 50
        are reduced to 50; negative values return 400. A page may hold fewer items.
      schema:
        type: integer
        minimum: 0
        default: 10
    PageToken:
      name: pageToken
      in: query
      description: >-
        Opaque nextPageToken from the previous page. Valid for 3 days and only with the
        same filters and sort; pageSize and fields may change. Otherwise 400 invalid-page-token.
      schema:
        type: string
  responses:
    Problem:
      description: >-
        An error in RFC 9457 Problem Details format. The type URI identifies the
        problem; see GET /problems for the catalog. title and detail follow
        Accept-Language (en, tr).
      headers:
        Content-Language:
          description: Language of title and detail.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            insufficientStock:
              summary: A business rule rejected a valid request
              value:
                type: https://api.example.com/problems/insufficient-stock
                title: Insufficient stock
                status: 422
                detail: Only 14 copies of Dune are available.
                instance: /customers/me/cart/items/9780441172719
                isbn: '9780441172719'
                availableQuantity: 14
                traceId: 00-baf1eea3e5d68af55c3632c25fea81d8-cba2b7f347a994e8-00
            validationFailed:
              summary: Fields that break the schema
              value:
                type: https://api.example.com/problems/validation-failed
                title: Some fields are invalid
                status: 400
                detail: Fix the fields listed in errors.
                instance: /books/9780441172719
                errors:
                  author: [required]
                  price.amount: [out-of-range]
                traceId: 00-47c489d08213092adc27b061c1eecdc9-15479e1362053da4-00
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
        currency:
          type: string
          description: ISO 4217 code.
          examples: [TRY]
    BookFields:
      type: object
      required: [title, author, category, price]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          pattern: '^[a-z]+(-[a-z]+)*$'
        price:
          $ref: '#/components/schemas/Money'
        description:
          type: string
          maxLength: 2000
    CreateBookRequest:
      allOf:
        - $ref: '#/components/schemas/BookFields'
        - type: object
          required: [isbn]
          properties:
            isbn:
              type: string
              pattern: '^97[89][0-9]{10}$'
    BookPatch:
      type: object
      description: Any subset of the writable fields; null removes description.
      additionalProperties: false
      properties:
        title:
          type: string
        author:
          type: string
        category:
          type: string
        price:
          type: object
          properties:
            amount:
              type: number
            currency:
              type: string
        description:
          type: [string, 'null']
    SetCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    Book:
      type: object
      required: [isbn, title, authors, category, price, inStock]
      properties:
        isbn:
          type: string
        title:
          type: string
        author:
          type: string
          deprecated: true
          description: >-
            Only in api-version 2026-09-01: the authors joined with ", ". Removed in
            2026-11-15; use authors.
        authors:
          type: array
          minItems: 1
          items:
            type: string
        category:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        inStock:
          type: boolean
        description:
          type: string
    BookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        nextPageToken:
          type: string
          description: Absent on the last page.
    OrderStatus:
      type: string
      description: New values may be added; clients must accept unknown values.
      examples: [Pending, Confirmed, PartiallyShipped, Shipped, Delivered, Cancelled]
    OrderItem:
      type: object
      required: [isbn, title, quantity, unitPrice]
      properties:
        isbn:
          type: string
        title:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
    Order:
      type: object
      required: [id, status, createdAt, items, total]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        customerId:
          type: string
          description: Present on orders of individual customers.
        institutionId:
          type: string
          description: Present on institutional orders.
        unitId:
          type: string
          description: Present on institutional orders.
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          $ref: '#/components/schemas/Money'
    OrderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        nextPageToken:
          type: string
          description: Absent on the last page.
    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [isbn, quantity]
            properties:
              isbn:
                type: string
                pattern: '^97[89][0-9]{10}$'
              quantity:
                type: integer
                minimum: 1
                maximum: 99
    Operation:
      type: object
      required: [id, kind, status, percentComplete, createdAt, lastUpdatedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          examples: [invoice-generation]
        status:
          type: string
          description: >-
            As in the Azure guidelines; Succeeded, Failed and Canceled are terminal.
            New values may be added; clients must accept unknown values (BS-52).
          examples: [NotStarted, Running, Succeeded, Failed, Canceled]
        percentComplete:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
        lastUpdatedAt:
          type: string
          format: date-time
        resourceLocation:
          type: string
          format: uri-reference
          description: Present when Succeeded; the resource the operation produced.
        error:
          $ref: '#/components/schemas/Problem'
    OrderBatchRequest:
      type: object
      required: [unitId, lines]
      properties:
        unitId:
          type: string
          description: The unit that orders; a buyer may only use their own unit.
        allOrNothing:
          type: boolean
          default: false
          description: true creates no order unless every line is accepted.
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [isbn, quantity]
            properties:
              isbn:
                type: string
                pattern: '^97[89][0-9]{10}$'
              quantity:
                type: integer
                minimum: 1
                maximum: 500
    OrderBatchReport:
      type: object
      required: [id, institutionId, unitId, acceptedLines, rejectedLines, results]
      properties:
        id:
          type: string
          format: uuid
        institutionId:
          type: string
        unitId:
          type: string
        orderId:
          type: string
          format: uuid
          description: The order created from the accepted lines; absent when none was created.
        acceptedLines:
          type: integer
        rejectedLines:
          type: integer
        results:
          type: array
          description: One entry per request line, in request order.
          items:
            type: object
            required: [line, isbn, status]
            properties:
              line:
                type: integer
                minimum: 1
              isbn:
                type: string
              status:
                type: string
                examples: [Accepted, Rejected]
              problem:
                $ref: '#/components/schemas/Problem'
    CreateReturnRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
    Return:
      type: object
      required: [id, orderId, status, reason, requestedAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          type: string
          examples: [Requested, Approved, Rejected, Refunded]
        reason:
          type: string
        requestedAt:
          type: string
          format: date-time
    CartItem:
      type: object
      required: [isbn, title, quantity, unitPrice]
      properties:
        isbn:
          type: string
        title:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
    Cart:
      type: object
      required: [customerId, items, total]
      properties:
        customerId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total:
          $ref: '#/components/schemas/Money'
    InstitutionUnit:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Institution:
      type: object
      required: [id, name, units]
      properties:
        id:
          type: string
        name:
          type: string
        units:
          type: array
          items:
            $ref: '#/components/schemas/InstitutionUnit'
    Problem:
      type: object
      required: [type, title, status, traceId]
      properties:
        type:
          type: string
          format: uri
          description: Stable identifier; the last segment is the catalog code.
          examples: [https://api.example.com/problems/insufficient-stock]
        title:
          type: string
          description: Same for every occurrence of the type; localized.
        status:
          type: integer
        detail:
          type: string
          description: This occurrence, for humans; clients must not parse it.
        instance:
          type: string
          format: uri-reference
          description: Path of the request that failed.
        traceId:
          type: string
          description: Quote it when contacting support.
        errors:
          type: object
          description: >-
            Only for validation-failed. Keys are JSON paths of the request (price.amount),
            values are rule codes.
          additionalProperties:
            type: array
            items:
              type: string
              examples: [required, out-of-range, invalid-length, invalid-format, read-only]
      additionalProperties: true
    ProblemType:
      type: object
      required: [type, code, status, title]
      properties:
        type:
          type: string
          format: uri
        code:
          type: string
        status:
          type: integer
        title:
          type: string
