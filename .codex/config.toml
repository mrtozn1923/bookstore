#:schema https://developers.openai.com/codex/config-schema.json
# Bookstore project settings for Codex. Codex loads this file only when the project is trusted.

sandbox_mode = "workspace-write"
approval_policy = "on-request"

# Commands may reach the network, but only the package registries below.
[sandbox_workspace_write]
network_access = true

[features.network_proxy]
enabled = true
domains = { "**.nuget.org" = "allow", "registry.npmjs.org" = "allow" }

# Keep parallel subagents to a number the laptop and the usage limit can carry.
[agents]
max_concurrent_threads_per_session = 4

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.85"]
startup_timeout_sec = 30
default_tools_approval_mode = "prompt"
