# Bookstore: the parts every environment shares. Development additions are in compose.override.yaml,
# CI in compose.ci.yaml, a production-like setup in compose.prod.yaml.
name: composeseries

include:
  - compose.db.yaml

services:
  api:
    build:
      context: .
      dockerfile: src/Bookstore.Api/Dockerfile
    env_file: config/api.env
    environment:
      Store__TimeZone: ${STORE_TIMEZONE:-Europe/Istanbul}
    secrets:
      # Key-per-file: /run/secrets/ConnectionStrings__Default becomes ConnectionStrings:Default
      - source: api-connection-string
        target: ConnectionStrings__Default
    configs:
      - source: api-settings
        target: /app/appsettings.Production.json
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - bookstore-api
    restart: unless-stopped

  web:
    build: ./web
    environment:
      API_BASE_URL: /api
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-compose}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

secrets:
  api-connection-string:
    file: ./secrets/api-connection-string.txt

configs:
  api-settings:
    file: ./config/appsettings.Production.json
