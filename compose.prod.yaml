# Production on a single server: COMPOSE_FILE=compose.yaml:compose.prod.yaml in the server's .env.
# The server never builds: images come from the registry with an immutable tag (TAG=1.3.0, never latest).
x-logging: &default-logging
  driver: json-file
  options:
    # Rotate: at most 3 files of 10 MB per container, otherwise the log grows until the disk is full
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Time for a clean shutdown (checkpoint) of a large database before Docker sends SIGKILL; the default is 10 s
    stop_grace_period: 60s
    environment:
      MSSQL_MEMORY_LIMIT_MB: "2048"
    deploy:
      resources:
        limits:
          memory: 3g
    logging: *default-logging

  migrate:
    logging: *default-logging

  api:
    build: !reset null
    image: ${REGISTRY:?set REGISTRY}/bookstore/api:${TAG:?set TAG}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    logging: *default-logging

  web:
    build: !reset null
    image: ${REGISTRY:?set REGISTRY}/bookstore/web:${TAG:?set TAG}
    environment:
      APP_ENVIRONMENT: production
    # !override: replace the base list instead of appending to it (8080 must not stay open)
    ports: !override
      - "80:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    logging: *default-logging

jobs:
  # Manual job (Compose 5.6+): docker compose run backup
  backup:
    image: mcr.microsoft.com/mssql/server:2025-latest
    entrypoint:
      - /bin/bash
      - -c
      - >-
        SQLCMDPASSWORD="$$(cat /run/secrets/sa-password)"
        exec /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -b -Q
        "BACKUP DATABASE BookstoreDb TO DISK = N'/var/opt/mssql/backup/BookstoreDb-$$(date -u +%Y%m%d-%H%M%S).bak' WITH COMPRESSION, CHECKSUM"
    secrets:
      - sa-password
    depends_on:
      db:
        condition: service_healthy
    triggers:
      manual: true
