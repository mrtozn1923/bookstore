# 12-13: a three-member replica set in ONE container (three mongod processes, small caches) - a lab, not production
name: bookstore-mongo-rs3

services:
  rs3:
    image: ${MONGO_IMAGE:-mongodb/mongodb-community-server:9.0-ubuntu2204}
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    entrypoint: ["bash", "/lab/scripts/12-rs3-start.sh"]
    ports:
      - "127.0.0.1:27021:27021"
      - "127.0.0.1:27022:27022"
      - "127.0.0.1:27023:27023"
    volumes:
      - ./data:/lab/data:ro
      - ./scripts:/lab/scripts:ro
