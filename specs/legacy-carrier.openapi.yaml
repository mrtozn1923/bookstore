openapi: 3.0.3
info:
  title: Legacy Carrier API
  version: "2.0"
servers:
  - url: http://localhost:9092
paths:
  /api/v2/quotes:
    get:
      operationId: getQuote
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
        - name: weight
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A price quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
components:
  schemas:
    Quote:
      type: object
      properties:
        QUOTE_ID:
          type: string
        AMT:
          type: string
        CUR:
          type: string
        SVC:
          type: string
        ETA_DAYS:
          type: integer
