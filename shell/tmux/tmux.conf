# Bookstore terminal series: ~/.config/tmux/tmux.conf (or ~/.tmux.conf)

# Keep the default prefix C-b: C-a is "beginning of line" in the shell

# Defaults that changed in newer tmux; set them for older versions too
set -g mouse on
set -sg escape-time 10

set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Colours: tell tmux the outer terminal supports 24-bit colour
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Splits and new windows open in the current pane's folder
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
