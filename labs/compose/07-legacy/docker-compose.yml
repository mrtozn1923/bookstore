# Bookstore as it was started in 2019: Compose file format 3.8, run with docker-compose (v1)
version: "3.8"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: composeseries-legacy-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - dbdata:/var/opt/mssql

  api:
    image: bookstore/api:2019
    links:
      - db
    depends_on:
      - db
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__Default=Server=db;Database=BookstoreDb;User Id=sa;Password=${SA_PASSWORD}
    ports:
      - "5000:80"
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    image: bookstore/web:2019
    depends_on:
      - api
    ports:
      - "80:8080"

volumes:
  dbdata:
