# Compose 5.3+: the schema step as an init container (pre_start) of api instead of the migrate service.
# docker compose -f compose.yaml -f labs/compose/02-pre-start.yaml up -d db api web
services:
  api:
    depends_on: !override
      db:
        condition: service_healthy
    pre_start:
      - image: mcr.microsoft.com/mssql/server:2025-latest
        entrypoint: ["/bin/bash", "-c"]
        command:
          - >-
            SQLCMDPASSWORD="$$(cat /hook-secrets/sa-password.txt)"
            BOOKSTORE_DB_PASSWORD="$$(cat /hook-secrets/db-app-password.txt)"
            exec /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -b
            -i /scripts/01-bookstore.sql -i /scripts/02-app-login.sql
        # Compose 5.7.1 does not mount secrets: into hooks (we got "Is a directory"), so the files come as a bind mount
        volumes:
          - ./db:/scripts:ro
          - ./secrets:/hook-secrets:ro
