# First draft of the api Deployment: values without quotes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: bookstore-api
    app.kubernetes.io/version: 1.10
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bookstore-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookstore-api
    spec:
      containers:
        - name: api
          image: bookstore-api:1.10.0
          env:
            - name: Shipping__DefaultCountry
              value: NO
            - name: Catalog__PageSize
              value: 20
