apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bookstore-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookstore-api
    spec:
      containers:
        - name: api
          image: bookstore-api:1.10.0
      resources:
        limits:
          memory: 512Mi
