info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{password}}"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.tokenType
      operator: eq
      value: Bearer
  scripts:
    - type: after-response
      code: |-
        bru.setVar("accessToken", res.body.accessToken);

settings:
  encodeUrl: true
