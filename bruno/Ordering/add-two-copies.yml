info:
  name: Add two copies
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/carts/{{cartId}}/items/{{isbn}}"
  body:
    type: json
    data: |-
      {
        "quantity": 2
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("cart total is two copies", function () {
          expect(res.status).to.equal(200);
          expect(res.body.items).to.have.lengthOf(1);
          expect(res.body.total).to.equal(bru.getVar("unitPrice") * 2);
        });

settings:
  encodeUrl: true
