info:
  name: Place order
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/orders"
  body:
    type: json
    data: |-
      {
        "cartId": "{{cartId}}",
        "customerName": "Ada Lovelace",
        "customerEmail": "{{email}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: after-response
      code: |-
        bru.setVar("orderUrl", res.headers["location"]);

settings:
  encodeUrl: true
